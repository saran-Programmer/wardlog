server:
  port: 9000

spring:
  application:
    name: timesheet-service
  datasource:
    url: jdbc:postgresql://${TIMESHEET_DB_HOST:localhost}:${TIMESHEET_DB_PORT:5432}/${TIMESHEET_DB_NAME:wardlog}
    username: ${TIMESHEET_DB_USERNAME:postgres}
    password: ${TIMESHEET_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}

aws:
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY}
  region: ${AWS_REGION}
  s3:
    bucket: ${S3_BUCKET}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true