server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service-auth
              uri: lb://user-microservice
              predicates:
                - Path=/api/v1/auth/**
            - id: user-service
              uri: lb://user-microservice
              predicates:
                - Path=/api/v1/users/**
            - id: timesheet-service
              uri: lb://timesheet-service
              predicates:
                - Path=/api/v1/activities/**,/api/v1/timesheet/**
            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/api/v1/conversations/**
   
jwt:
  secret: ${JWT_SECRET}

security:
  public-paths:
    - /api/v1/auth/login
    - /api/v1/auth/register
    - /api/v1/auth/refresh

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
