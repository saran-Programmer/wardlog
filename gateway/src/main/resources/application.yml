server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service-auth
              uri: ${USER_SERVICE_URL:http://localhost:9100}
              predicates:
                - Path=/api/v1/auth/**
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:9100}
              predicates:
                - Path=/api/v1/users/**
            - id: timesheet-service
              uri: ${TIMESHEET_SERVICE_URL:http://localhost:9000}
              predicates:
                - Path=/api/v1/activities/**,/api/v1/timesheet/**
            - id: ai-service
              uri: ${AI_SERVICE_URL:http://localhost:8000}
              predicates:
                - Path=/api/v1/conversations/**

jwt:
  secret: ${JWT_SECRET}

security:
  public-paths:
    - /api/v1/auth/login
    - /api/v1/auth/register
    - /api/v1/auth/refresh

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
