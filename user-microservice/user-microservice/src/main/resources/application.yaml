server:
  port: 9100

spring:
  application:
    name: user-microservice
  datasource:
    url: jdbc:postgresql://${USER_DB_HOST:localhost}:${USER_DB_PORT:5432}/${USER_DB_NAME:wardlog-user}
    username: ${USER_DB_USERNAME:postgres}
    password: ${USER_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-minutes: 15
  refresh-token-days: 30

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
